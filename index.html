<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的第一个网页</title>
</head>
<body>

  <h1>学习：链接、图片、列表</h1>

  <!-- 链接 -->
  <a href="https://www.baidu.com" target="_blank">去百度</a>
  <br><br>

  <!-- 图片 -->
  <img src="https://picsum.photos/200/100" alt="随机图片" width="200">
  <br><br>

  <!-- 无序列表 -->
  <h3>我的导航</h3>
  <ul>
    <li>首页</li>
    <li>博客</li>
    <li>作品集</li>
  </ul>

  <!-- 有序列表 -->
  <h3>学习计划</h3>
  <ol>
    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>
  </ol>
  <h2>我的主页</h2>
<ol>
	<li>首页</li>
	<li>一</li>
	<li>二</li>
	<li>三</li>
	<li>四</li>
	<li>五</li>
	<li>六</li>	
</ol>
</body>
</html>
