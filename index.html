<script>
const el = document.getElementById('rainbow');
let x = 100, y = 100;
// 45度移动：横向和纵向速度相同
let speedX = 3;
let speedY = 3;
function animate() {
  const w = window.innerWidth - el.offsetWidth;
  const h = window.innerHeight - el.offsetHeight;

  // 碰到左右边缘反弹
  if (x < 0 || x > w) speedX *= -1;
  // 碰到上下边缘反弹
  if (y < 0 || y > h) speedY *= -1;

  x += speedX;
  y += speedY;

  el.style.left = x + 'px';
  el.style.top = y + 'px';

  requestAnimationFrame(animate);
}
 animate();
 
</script>
