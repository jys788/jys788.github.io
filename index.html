<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>视频列表居中排列</title>
<style>
  /* 外层容器：整体居中 */
  .video-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-wrap: wrap;       /* 自动换行 */
    justify-content: center; /* 水平居中 */
    gap: 20px;             /* 视频之间间距 */
  }

  /* 单个视频项 */
  .video-item {
    width: 320px;
    text-align: center;    /* 标题居中 */
  }

  /* 视频样式 */
  .video-item video {
    width: 100%;
    height: auto;
    border-radius: 8px;
  }

  /* 标题样式 */
  .video-title {
    margin-top: 10px;
    font-size: 16px;
    color:red;
  }
</style>
 <!--<script>
 // 页面加载后，自动取消静音（有声音播放）
 window.addEventListener('load', () => {
   document.querySelectorAll('video').forEach(vid => {
     vid.muted = false;
   });
 });
 </script>-->
</head>
<body>

<div class="video-container">
  <!-- 视频1 -->
  <div class="video-item">
